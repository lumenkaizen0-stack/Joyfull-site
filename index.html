<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOYFULL — Ventes & achats, bons articles Lubumbashi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#D4AF37;
  --gold-light:#F1D77A;
  --black:#080808;
  --white:#F8F6F0;
  --sub:#C8C1AE;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',sans-serif;
  background:#050505;
  color:var(--white);
  line-height:1.5;
  min-height:100vh;
  padding-bottom:76px;
}
h1,h2,h3,.brand{font-family:'Baloo 2',sans-serif;}
img{max-width:100%;display:block;}

/* NAVIGATION */
nav{
  position:sticky;top:0;z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 5vw;
  background:rgba(5,5,5,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid #5A4512;
}
.brand{font-size:1.3rem;font-weight:800;color:var(--gold-light);}
.brand span{color:#fff;}

#cart-btn{
  background:#080808;color:var(--white);
  border:1px solid var(--gold);border-radius:14px;padding:8px 14px;
  font-weight:600;font-size:.88rem;cursor:pointer;
}

/* HEADER & ACTIONS */
.profile{
  text-align:center;padding:24px 6vw 20px;
  background:rgba(0,0,0,.4);
  border-bottom:1px solid #5A4512;
}
.avatar{
  width:80px;height:80px;border-radius:50%;background:#111;
  margin:0 auto 10px;display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);font-size:2rem;
}
.profile h1{font-size:1.5rem;color:#fff;}
.profile p.bio{color:var(--sub);font-size:.85rem;margin-bottom:12px;}

.header-actions{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;
}
.btn-action{
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:#080808;border:none;border-radius:10px;padding:8px 14px;
  font-weight:700;font-size:.8rem;cursor:pointer;
}
.btn-action-outline{
  background:#080808;color:var(--gold-light);border:1px solid var(--gold);
  border-radius:10px;padding:8px 14px;font-weight:700;font-size:.8rem;cursor:pointer;
}

/* SECTIONS */
section{padding:20px 5vw;border-bottom:1px solid #2A2110;}
.section-head{margin-bottom:12px;}
.section-head h2{font-size:1.2rem;color:#fff;}

.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.cat-card{background:#111;border:1px solid #3A3018;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;}
.cat-card.active{border-color:var(--gold);background:#1a1508;}
.cat-emoji{font-size:1.4rem;}
.cat-name{font-size:.7rem;font-weight:600;margin-top:4px;}

.shops-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;}
.shop-card{background:#111;border:1px solid #3A3018;border-radius:12px;padding:12px;text-align:center;}

/* MODALES */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-overlay.open{display:flex;}
.modal-box{background:#0B0B0B;border:1px solid var(--gold);border-radius:16px;padding:20px;max-width:380px;width:100%;position:relative;}
.modal-close{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--gold-light);font-size:1.2rem;cursor:pointer;}

.form-group{margin-bottom:10px;}
.form-group label{display:block;font-size:.75rem;color:var(--sub);margin-bottom:4px;}
.form-group input, .form-group select, .form-group textarea{
  width:100%;background:#141414;border:1px solid #5A4512;border-radius:8px;padding:8px;color:#fff;font-size:.82rem;
}
.form-submit{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#080808;border:none;border-radius:8px;padding:10px;font-weight:700;font-size:.85rem;cursor:pointer;margin-top:6px;}

.comments-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:200px;overflow-y:auto;}
.comment-card{background:#141414;border:1px solid #2A2110;border-radius:8px;padding:8px;}
.comment-author{font-weight:700;color:var(--gold-light);font-size:.75rem;}
.comment-body{font-size:.8rem;color:#E3DED2;}

/* LIENS SOCIAUX JOYFULL OFFICIAL */
.social-links{display:flex;justify-content:center;gap:12px;margin-top:10px;}
.social-btn{color:var(--gold-light);text-decoration:none;font-size:.8rem;border:1px solid #3A3018;padding:4px 8px;border-radius:6px;}
</style>
</head>
<body>

<nav>
  <div class="brand">JOY<span>FULL</span></div>
  <button id="cart-btn">🛒 Panier (0)</button>
</nav>

<div class="profile">
  <div class="avatar">🛍️</div>
  <h1 id="user-display-name">JOYFULL</h1>
  <p class="bio">Plateforme d'achats et ventes à Lubumbashi</p>

  <div class="header-actions">
    <button class="btn-action" id="auth-btn" onclick="openAuthModal()">🔑 S'inscrire / Connexion</button>
    <button class="btn-action-outline" onclick="openCommentsModal()">💬 Avis & Discussions</button>
  </div>
</div>

<section id="categories">
  <div class="section-head">
    <h2>Catégories</h2>
  </div>
  <div class="cat-grid" id="cat-grid"></div>
</section>

<section id="shops-section">
  <div class="section-head">
    <h2>Boutiques & Restaurants</h2>
  </div>
  <div class="shops-grid" id="shops-grid"></div>
</section>

<!-- MODALE D'INSCRIPTION / CONNEXION -->
<div class="modal-overlay" id="auth-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeAuthModal()">✕</button>
    <h3>Créer un compte Joyfull</h3>
    
    <div class="form-group">
      <label>Type de compte</label>
      <select id="auth-role" onchange="toggleVendorCategory()">
        <option value="client">Compte Acheteur (Client)</option>
        <option value="vendeur">Compte Vendeur (Boutique/Resto)</option>
      </select>
    </div>

    <!-- SELECTION DE CATEGORIE (VISIBLE UNIQUEMENT SI VENDEUR) -->
    <div class="form-group" id="vendor-cat-group" style="display:none;">
      <label>Catégorie de votre activité</label>
      <select id="auth-vendor-cat">
        <option value="restaurants">Restaurants</option>
        <option value="boutiques">Boutique (Mode/Accessoires)</option>
        <option value="electronique">Électronique</option>
        <option value="beaute">Beauté & Soins</option>
      </select>
    </div>

    <div class="form-group">
      <label>Nom complet ou Nom du commerce</label>
      <input type="text" id="auth-name" placeholder="Ex: Jean DRC ou Resto DRC">
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="auth-email" placeholder="votre@email.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="auth-password" placeholder="******">
    </div>
    <button class="form-submit" onclick="handleSignUp()">Valider mon inscription</button>
  </div>
</div>

<!-- MODALE AVIS & COMMENTAIRES -->
<div class="modal-overlay" id="comments-modal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeCommentsModal()">✕</button>
    <h3>Avis & Discussions publiques</h3>
    <div class="form-group">
      <input type="text" id="comment-name" placeholder="Ton nom">
    </div>
    <div class="form-group">
      <textarea id="comment-text" placeholder="Écris ton avis..." style="height:60px;"></textarea>
    </div>
    <button class="form-submit" onclick="postComment()">Publier</button>
    
    <div class="comments-list" id="comments-list"></div>
  </div>
</div>

<script>
  // Catégories mises à jour avec "Restaurants"
  const CATEGORIES = [
    { id: "restaurants", name: "Restaurants", emoji: "🍲" },
    { id: "boutiques", name: "Boutiques", emoji: "🛍️" },
    { id: "electronique", name: "Électronique", emoji: "📲" },
    { id: "beaute", name: "Beauté", emoji: "💄" },
  ];

  let activeCategory = CATEGORIES[0].id;

  function renderCategories(){
    document.getElementById('cat-grid').innerHTML = CATEGORIES.map(c => `
      <div class="cat-card ${c.id === activeCategory ? 'active' : ''}" onclick="selectCategory('${c.id}')">
        <div class="cat-emoji">${c.emoji}</div>
        <div class="cat-name">${c.name}</div>
      </div>
    `).join('');
  }

  function selectCategory(catId){
    activeCategory = catId;
    renderCategories();
  }

  function toggleVendorCategory() {
    const role = document.getElementById('auth-role').value;
    const catGroup = document.getElementById('vendor-cat-group');
    catGroup.style.display = (role === 'vendeur') ? 'block' : 'none';
  }

  function openAuthModal(){ document.getElementById('auth-modal').classList.add('open'); }
  function closeAuthModal(){ document.getElementById('auth-modal').classList.remove('open'); }
  function openCommentsModal(){ document.getElementById('comments-modal').classList.add('open'); }
  function closeCommentsModal(){ document.getElementById('comments-modal').classList.remove('open'); }

  renderCategories();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, query, orderBy, serverTimestamp, onSnapshot, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
  import { getAuth, createUserWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCmzbxSA6sKCbIKVL1vw3zLk1cP_zqs_ns",
    authDomain: "joyfull-a1fba.firebaseapp.com",
    projectId: "joyfull-a1fba",
    storageBucket: "joyfull-a1fba.firebasestorage.app",
    messagingSenderId: "1081441505666",
    appId: "1:1081441505666:web:bf7703a0ef8b9be2d23f9b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Inscription Utilisateur / Vendeur
  window.handleSignUp = async function() {
    const role = document.getElementById('auth-role').value;
    const vendorCat = document.getElementById('auth-vendor-cat').value;
    const name = document.getElementById('auth-name').value.trim();
    const email = document.getElementById('auth-email').value.trim();
    const password = document.getElementById('auth-password').value;

    if(!name || !email || !password) return alert("Veuillez remplir tous les champs.");

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // Enregistrement des données dans Firestore
      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        name: name,
        email: email,
        role: role,
        vendorCategory: role === 'vendeur' ? vendorCat : null,
        createdAt: serverTimestamp()
      });

      alert(`Compte ${role === 'vendeur' ? 'Vendeur' : 'Acheteur'} créé avec succès !`);
      window.closeAuthModal();
    } catch(error) {
      alert("Erreur lors de l'inscription : " + error.message);
    }
  };

  // Suivi de l'état de connexion
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('auth-btn').textContent = "👤 Mon Profil";
    }
  });

  // Gestion des commentaires
  window.postComment = async function() {
    const name = document.getElementById('comment-name').value.trim();
    const text = document.getElementById('comment-text').value.trim();
    if(!name || !text) return alert("Remplissez votre nom et message.");

    await addDoc(collection(db, "comments"), { author: name, text: text, createdAt: serverTimestamp() });
    document.getElementById('comment-text').value = "";
  };

  function listenToComments() {
    const listEl = document.getElementById('comments-list');
    const q = query(collection(db, "comments"), orderBy("createdAt", "desc"));
    onSnapshot(q, (snapshot) => {
      let html = '';
      snapshot.forEach((doc) => {
        const data = doc.data();
        html += `<div class="comment-card"><div class="comment-author">${data.author}</div><div class="comment-body">${data.text}</div></div>`;
      });
      listEl.innerHTML = html || '<div style="color:#888;font-size:.8rem;">Aucun commentaire.</div>';
    });
  }

  listenToComments();
</script>
</body>
</html>
